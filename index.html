<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jelly Officer Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ff-orange: #FF6B00;
    --ff-yellow: #FFD700;
    --ff-red: #E63946;
    --ff-dark: #0A0A0F;
    --ff-panel: #10111A;
    --ff-border: #FF6B00;
    --ff-glow: rgba(255, 107, 0, 0.6);
  }

  body {
    background: var(--ff-dark);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: crosshair;
  }

  /* BG Effects */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(230, 57, 70, 0.08) 0%, transparent 50%),
      repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(255,107,0,0.02) 40px, rgba(255,107,0,0.02) 41px),
      repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(255,107,0,0.02) 40px, rgba(255,107,0,0.02) 41px);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 15px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 30px;
    animation: fadeDown 0.8s ease;
  }

  .ff-logo {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--ff-orange);
    text-transform: uppercase;
    opacity: 0.8;
    margin-bottom: 6px;
  }

  .panel-title {
    font-family: 'Orbitron', monospace;
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    text-transform: uppercase;
    line-height: 1;
    text-shadow: 0 0 20px var(--ff-glow), 0 0 40px rgba(255,107,0,0.3);
    position: relative;
  }

  .panel-title span {
    color: var(--ff-orange);
  }

  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 3px;
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Divider */
  .divider {
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--ff-orange), var(--ff-yellow), var(--ff-orange), transparent);
    margin: 20px 0;
    position: relative;
  }

  .divider::before {
    content: '◆';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--ff-yellow);
    font-size: 10px;
    background: var(--ff-dark);
    padding: 0 8px;
  }

  /* Main Card */
  .panel-card {
    width: 100%;
    background: linear-gradient(135deg, rgba(255,107,0,0.05) 0%, rgba(10,10,15,0.95) 50%, rgba(230,57,70,0.05) 100%);
    border: 1px solid rgba(255,107,0,0.3);
    border-radius: 4px;
    padding: 30px 25px;
    position: relative;
    animation: fadeUp 0.8s ease 0.2s both;
    box-shadow: 0 0 30px rgba(255,107,0,0.1), inset 0 0 30px rgba(0,0,0,0.5);
  }

  /* Corner accents */
  .panel-card::before,
  .panel-card::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    border-color: var(--ff-orange);
    border-style: solid;
  }

  .panel-card::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }

  .panel-card::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  /* Character Display */
  .char-display {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
    padding: 12px;
    background: rgba(255,107,0,0.05);
    border: 1px solid rgba(255,107,0,0.15);
    border-radius: 3px;
  }

  .char-avatar {
    width: 55px;
    height: 55px;
    background: linear-gradient(135deg, #FF6B00, #E63946);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    box-shadow: 0 0 15px rgba(255,107,0,0.4);
    border: 1px solid var(--ff-orange);
    position: relative;
    overflow: hidden;
  }

  .char-avatar::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
    animation: shine 3s infinite;
  }

  .char-info .rank {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    color: var(--ff-orange);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .char-info .name {
    font-family: 'Orbitron', monospace;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .char-info .badge {
    display: inline-block;
    background: linear-gradient(90deg, var(--ff-orange), var(--ff-yellow));
    color: #000;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 8px;
    letter-spacing: 2px;
    margin-top: 4px;
    border-radius: 2px;
  }

  /* Form */
  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--ff-orange);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 8px;
    font-weight: 600;
  }

  .form-label::before {
    content: '▸';
    color: var(--ff-yellow);
  }

  .form-input {
    width: 100%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,107,0,0.25);
    border-radius: 3px;
    padding: 12px 15px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    transition: all 0.3s ease;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--ff-orange);
    box-shadow: 0 0 15px rgba(255,107,0,0.2), inset 0 0 10px rgba(255,107,0,0.05);
    background: rgba(255,107,0,0.05);
  }

  .form-input::placeholder {
    color: rgba(255,255,255,0.2);
    letter-spacing: 1px;
  }

  /* Password field */
  .pass-wrap {
    position: relative;
  }

  .pass-wrap input {
    padding-right: 45px;
    letter-spacing: 4px;
    font-size: 18px;
  }

  .pass-toggle {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,107,0,0.5);
    cursor: pointer;
    font-size: 16px;
    transition: color 0.2s;
  }

  .pass-toggle:hover { color: var(--ff-orange); }

  /* Pass hint */
  .pass-hint {
    margin-top: 6px;
    display: flex;
    gap: 5px;
  }

  .hint-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,107,0,0.2);
    border: 1px solid rgba(255,107,0,0.3);
    transition: all 0.3s;
  }

  .hint-dot.active {
    background: var(--ff-orange);
    box-shadow: 0 0 6px var(--ff-orange);
  }

  /* Submit Button */
  .btn-enter {
    width: 100%;
    margin-top: 22px;
    padding: 15px;
    background: linear-gradient(135deg, #FF6B00, #E63946);
    border: none;
    border-radius: 3px;
    color: #fff;
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 4px 20px rgba(255,107,0,0.3);
  }

  .btn-enter::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    transition: left 0.5s;
  }

  .btn-enter:hover::before { left: 100%; }

  .btn-enter:hover {
    box-shadow: 0 6px 30px rgba(255,107,0,0.5);
    transform: translateY(-1px);
  }

  .btn-enter:active {
    transform: translateY(1px);
    box-shadow: 0 2px 10px rgba(255,107,0,0.3);
  }

  /* Status bar */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid rgba(255,107,0,0.1);
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #00FF88;
    box-shadow: 0 0 8px #00FF88;
    animation: pulse 2s infinite;
  }

  /* Alert */
  .alert {
    display: none;
    padding: 12px 15px;
    border-radius: 3px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-top: 15px;
    text-align: center;
    animation: fadeUp 0.3s ease;
  }

  .alert.success {
    display: block;
    background: rgba(0, 255, 136, 0.1);
    border: 1px solid rgba(0, 255, 136, 0.3);
    color: #00FF88;
  }

  .alert.error {
    display: block;
    background: rgba(230, 57, 70, 0.1);
    border: 1px solid rgba(230, 57, 70, 0.3);
    color: var(--ff-red);
  }

  /* Footer */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 10px;
    color: rgba(255,255,255,0.15);
    letter-spacing: 2px;
    animation: fadeUp 0.8s ease 0.4s both;
  }

  /* ANIMATIONS */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  @keyframes shine {
    0% { transform: rotate(45deg) translateX(-200%); }
    100% { transform: rotate(45deg) translateX(200%); }
  }

  /* Access granted screen */
  .access-granted {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.5s ease;
  }

  .access-granted.show { display: block; }

  .access-icon {
    font-size: 60px;
    margin-bottom: 15px;
    animation: pulse 1s 3;
  }

  .access-title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 900;
    color: #00FF88;
    text-shadow: 0 0 20px rgba(0,255,136,0.5);
    letter-spacing: 3px;
    margin-bottom: 8px;
  }

  .access-sub {
    color: rgba(255,255,255,0.4);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="ff-logo">⚡ Free Fire</div>
    <div class="panel-title">JELLY <span>OFFICER</span></div>
    <div class="subtitle">Secure Access Panel</div>
  </div>

  <div class="divider"></div>

  <!-- Main Panel Card -->
  <div class="panel-card">

    <!-- Character Display -->
    <div class="char-display">
      <div class="char-avatar">🪖</div>
      <div class="char-info">
        <div class="rank">◆ RANK S+ ◆</div>
        <div class="name">Jelly</div>
        <div class="badge">⭐ OFFICER ⭐</div>
      </div>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <div class="form-label">Player ID</div>
        <input class="form-input" type="text" id="playerId" placeholder="Enter your Player ID" autocomplete="off">
      </div>

      <div class="form-group">
        <div class="form-label">Access Code</div>
        <div class="pass-wrap">
          <input class="form-input" type="password" id="passInput" placeholder="••••••••" maxlength="10"
            oninput="updateDots(this.value)">
          <button class="pass-toggle" onclick="togglePass()">👁</button>
        </div>
        <div class="pass-hint" id="passHint">
          <div class="hint-dot" id="d0"></div>
          <div class="hint-dot" id="d1"></div>
          <div class="hint-dot" id="d2"></div>
          <div class="hint-dot" id="d3"></div>
          <div class="hint-dot" id="d4"></div>
          <div class="hint-dot" id="d5"></div>
          <div class="hint-dot" id="d6"></div>
          <div class="hint-dot" id="d7"></div>
          <div class="hint-dot" id="d8"></div>
          <div class="hint-dot" id="d9"></div>
        </div>
      </div>

      <button class="btn-enter" onclick="checkPassword()">
        ▶ ENTER PANEL ◀
      </button>

      <div class="alert" id="alertBox"></div>

      <div class="status-bar">
        <div class="status-item">
          <div class="status-dot"></div>
          Server Online
        </div>
        <div class="status-item">🔒 Encrypted</div>
        <div class="status-item">🏆 Season 30</div>
      </div>
    </div>

    <!-- Access Granted -->
    <div class="access-granted" id="grantedScreen">
      <div class="access-icon">🎖️</div>
      <div class="access-title">ACCESS GRANTED</div>
      <div class="access-sub">Welcome, Officer Jelly</div>
      <br>
      <div style="color: rgba(255,255,255,0.5); font-size: 13px; letter-spacing: 1px;">
        Loading officer dashboard...
      </div>
    </div>

  </div>

  <div class="footer">© JELLY OFFICER PANEL · FF EMOTE ZONE · V2.0</div>

</div>

<script>
  const CORRECT_PASS = "6716673666";

  function togglePass() {
    const inp = document.getElementById('passInput');
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function updateDots(val) {
    for (let i = 0; i < 10; i++) {
      const dot = document.getElementById('d' + i);
      if (dot) dot.classList.toggle('active', i < val.length);
    }
  }

  function checkPassword() {
    const pass = document.getElementById('passInput').value.trim();
    const alert = document.getElementById('alertBox');
    const pid = document.getElementById('playerId').value.trim();

    if (!pid) {
      showAlert('error', '⚠ Player ID required!');
      return;
    }

    if (pass === CORRECT_PASS) {
      alert.className = 'alert';
      alert.style.display = 'none';
      setTimeout(() => {
        document.getElementById('loginForm').style.opacity = '0';
        document.getElementById('loginForm').style.transition = 'opacity 0.4s';
        setTimeout(() => {
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('grantedScreen').classList.add('show');
        }, 400);
      }, 300);
    } else {
      showAlert('error', '❌ Wrong password! Try again.');
      document.getElementById('passInput').value = '';
      updateDots('');
    }
  }

  function showAlert(type, msg) {
    const a = document.getElementById('alertBox');
    a.className = 'alert ' + type;
    a.textContent = msg;
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPassword();
  });
</script>
</body>
</html>
