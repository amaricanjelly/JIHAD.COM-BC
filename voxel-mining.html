<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Mining Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="voxel-style.css">
</head>
<body>
    <div id="container"></div>
    <div id="ui">
        <div id="stats">
            <div>Stone: <span id="stone">0</span></div>
            <div>Gold: <span id="gold">0</span></div>
            <div>Diamond: <span id="diamond">0</span></div>
            <div>Level: <span id="level">1</span></div>
        </div>
        <div id="info">
            <p>WASD to move | Mouse to look | Click to mine</p>
            <p>Depth: <span id="depth">0</span>m</p>
        </div>
        <div id="inventory">
            <h3>Inventory</h3>
            <div id="inv-list"></div>
        </div>
    </div>
    <script src="voxel-game.js"></script>
</body>
</html>
